<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check-in diario</title>
  <link rel="stylesheet" href="checkin.css">
</head>
<body>

  <main>
    <header>
      <h1>¿Cómo te sentís hoy?</h1>
    </header>

    <form>
      <section>
        <label>
          <input type="radio" name="animo">
          <span class="emoji">😭</span>
          Muy triste
        </label>

        <label>
          <input type="radio" name="animo">
          <span class="emoji">😔</span>
          Algo triste
        </label>

        <label>
          <input type="radio" name="animo">
          <span class="emoji">😐</span>
          Neutral
        </label>

        <label>
          <input type="radio" name="animo">
          <span class="emoji">🙂</span>
          Bien
        </label>

        <label>
          <input type="radio" name="animo">
          <span class="emoji">😄</span>
          Muy bien
        </label>
      </section>

      <button type="submit">Continuar</button>
    </form>
  </main>

</body>
</html>
